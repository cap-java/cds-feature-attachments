name: Bind Cloud Foundry Services
description: Login to CF and bind services for hybrid testing via cds bind

inputs:
  cf-api:
    description: Cloud Foundry API endpoint
    required: true
  cf-org:
    description: Cloud Foundry organization
    required: true
  cf-space:
    description: Cloud Foundry space
    required: true
  cf-user-origin:
    description: Origin key of the platform IdP (SAP Cloud Identity Services) for Cloud Foundry
    required: true
  cis-issuer-uri:
    description: Issuer URI of the SAP Cloud Identity Services tenant, used as audience of the GitHub OIDC token
    required: true
  auth-method:
    description: 'Malware scanner authentication method: basic or mtls'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Cloud Foundry
      uses: cap-js/cf-setup@c52742d9cfff538a77265af25c054758da9813da # v2.1.0
      with:
        api: ${{ inputs.cf-api }}
        org: ${{ inputs.cf-org }}
        space: ${{ inputs.cf-space }}
        origin: ${{ inputs.cf-user-origin }}
        oidc-audience: ${{ inputs.cis-issuer-uri }}

    - name: Install CDS dependencies
      shell: bash
      working-directory: integration-tests/mtx-local
      run: |
        npm ci
        echo "$(pwd)/node_modules/.bin" >> "${GITHUB_PATH}"

    - name: Bind objectstore
      shell: bash
      working-directory: integration-tests/mtx-local
      run: |
        for i in {1..5}; do
          cds bind objectstore --to objectstore:ci-pipeline && break
          echo "cds bind objectstore failed, retrying ($i/5)..."
          sleep 30
          if [ "$i" -eq 5 ]; then
            echo "cds bind objectstore failed after 5 attempts."
            exit 1
          fi
        done

    - name: Bind malware-scanner (basic)
      if: inputs.auth-method == 'basic'
      shell: bash
      working-directory: integration-tests/mtx-local
      run: cds bind malware-scanner --to malware-scanner:malware-key-basic

    - name: Bind malware-scanner (mtls)
      if: inputs.auth-method == 'mtls'
      shell: bash
      working-directory: integration-tests/mtx-local
      run: cds bind malware-scanner --to malware-scanner:malware-key-mtls
