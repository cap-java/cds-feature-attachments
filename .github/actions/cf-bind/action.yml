name: Bind Cloud Foundry Services
description: Login to CF and bind services for hybrid testing via cds bind

inputs:
  cf-api:
    description: Cloud Foundry API endpoint
    required: true
  cf-org:
    description: Cloud Foundry organization
    required: true
  cf-space:
    description: Cloud Foundry space
    required: true
  cf-user-origin:
    description: Origin key of the platform IdP (SAP Cloud Identity Services) in Cloud Foundry
    required: true
  cis-issuer-uri:
    description: Issuer URI of the SAP Cloud Identity Services tenant, used as audience of the GitHub OIDC token
    required: true
  auth-method:
    description: 'Malware scanner authentication method: basic or mtls'
    required: true

runs:
  using: composite
  steps:
    - name: Install CF CLI
      shell: bash
      env:
        CF_CLI_VERSION: '8.18.3'
      run: |
        wget -q "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=${CF_CLI_VERSION}&source=github-rel" -O cf-cli.tar.gz
        tar -xzf cf-cli.tar.gz
        sudo mv cf8 /usr/local/bin/cf
        cf --version

    - name: CF Login (GitHub OIDC)
      shell: bash
      env:
        CF_API: ${{ inputs.cf-api }}
        CF_ORG: ${{ inputs.cf-org }}
        CF_SPACE: ${{ inputs.cf-space }}
        CF_USER_ORIGIN: ${{ inputs.cf-user-origin }}
        CIS_ISSUER_URI: ${{ inputs.cis-issuer-uri }}
      run: |
        if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is not set. The calling job needs 'permissions: id-token: write'."
          exit 1
        fi
        audience=$(jq -rn --arg a "$CIS_ISSUER_URI" '$a|@uri')
        for i in {1..5}; do
          # Token is short-lived, so request a fresh one on every attempt
          githubJwt=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r '.value // empty')
          if [ -n "$githubJwt" ]; then
            echo "::add-mask::$githubJwt"
            cf api "$CF_API" && \
            cf auth --assertion "$githubJwt" --origin "$CF_USER_ORIGIN" && \
            cf target -o "$CF_ORG" -s "$CF_SPACE" && break
          fi
          if [ "$i" -eq 5 ]; then
            echo "cf login failed after 5 attempts."
            exit 1
          fi
          echo "cf login failed, retrying ($i/5)..."
          sleep 10
        done

    - name: Install CDS dependencies
      shell: bash
      working-directory: integration-tests/mtx-local
      run: |
        npm ci
        echo "$(pwd)/node_modules/.bin" >> "${GITHUB_PATH}"

    - name: Bind objectstore
      shell: bash
      working-directory: integration-tests/mtx-local
      run: |
        for i in {1..5}; do
          cds bind os -2 os:pipeline && break
          echo "cds bind objectstore failed, retrying ($i/5)..."
          sleep 30
          if [ "$i" -eq 5 ]; then
            echo "cds bind objectstore failed after 5 attempts."
            exit 1
          fi
        done

    - name: Bind malware-scanner (basic)
      if: inputs.auth-method == 'basic'
      shell: bash
      working-directory: integration-tests/mtx-local
      run: cds bind malware -2 malware:malware-key-basic

    - name: Bind malware-scanner (mtls)
      if: inputs.auth-method == 'mtls'
      shell: bash
      working-directory: integration-tests/mtx-local
      run: cds bind malware -2 malware:malware-key-mtls

    - name: CF Logout
      if: always()
      shell: bash
      run: cf logout || true
